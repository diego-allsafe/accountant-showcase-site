      content="Estudio contable especializado en asesoramiento impositivo y financiero para monotributistas, autónomos y pymes."

    <title>Contacto | Estudio Contable</title>
    <link rel="stylesheet" href="../css/styles.css" />

  <body class="home">
    <!-- ===== HEADER ===== -->

    <header>
      <nav class="container">
        <div class="logo">Estudio Contable</div>
        <ul>

          <li><a href="nosotros.html">Nosotros</a></li>

        </ul>
      </nav>
    </header>
    <!-- ===== CONTACTO CON FONDO Y FORMULARIO CENTRADO ===== -->

    <main class="contact-hero">
      <div class="contact-box">
        <h1>Estamos para responderte</h1>
        <p>
          Si necesitás asesoramiento o querés analizar tu situación impositiva,
          escribinos y nos pondremos en contacto a la brevedad.
        </p>

        <form>
          <div class="form-row">
            <input type="text" placeholder="Nombre" required />
            <input type="email" placeholder="Correo electrónico" required />
          </div>

          <textarea placeholder="Tu mensaje..." rows="4" required></textarea>

          <button type="submit" class="btn">Enviar</button>
        </form>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
